product:
  type: kmp/lib
  platforms: [android, jvm]

# The desktop webview (KCEF) pulls JOGL, which is only published here.
repositories:
  - https://jogamp.org/deployment/maven

dependencies:
  - //provider
  - $kotlin.serialization.json
  - $kotlin.reflect
  - $compose.runtime
  - $compose.foundation
  - $compose.material3
  - $compose.ui
  - $compose.components.resources
  - $compose.preview
  - $compose.hotReload.runtimeApi
  - $libs.androidx.lifecycle.viewmodel.compose
  - $libs.androidx.lifecycle.runtime.compose
  - $libs.jetbrains.navigation3.ui
  - $libs.jetbrains.lifecycle.viewmodelNavigation3
  - $libs.jetbrains.material3.adaptiveNavigation3
  - $libs.qrose
  - $libs.haze
  - $libs.haze.blur
  - $libs.compottie
  - nl.jacobras:Human-Readable:2.0.0
  - org.jetbrains.kotlinx:kotlinx-datetime:0.8.0
  - $libs.androidx.room3.runtime
  - $libs.androidx.sqlite.bundled

dependencies@android:
  - $compose.uiTooling
  - $libs.androidx.activity.compose
  - androidx.camera:camera-core:1.4.2
  - androidx.camera:camera-camera2:1.4.2
  - androidx.camera:camera-lifecycle:1.4.2
  - androidx.camera:camera-view:1.4.2
  - com.google.zxing:core:3.5.3
  # Headless Lottie rendering: TGS stickers are prerendered to GIF for MAX,
  # which has no animated sticker format.
  - $libs.lottie.android
  - $libs.alpha.video
  - $libs.alpha.video.vpx

dependencies@jvm:
  # Desktop captcha: an embedded Chromium browser (KCEF) wrapped by Compose.
  - $libs.compose.webview.multiplatform
  - $libs.kcef
  - $libs.filekit.dialogs
  - $libs.javacv
  - com.google.zxing:core:3.5.3
  - org.bytedeco:javacpp:1.5.14:linux-x86_64
  - org.bytedeco:javacpp:1.5.14:windows-x86_64
  - org.bytedeco:javacpp:1.5.14:macosx-arm64
  - org.bytedeco:javacpp:1.5.14:macosx-x86_64
  - org.bytedeco:ffmpeg:8.1.2-1.5.14:linux-x86_64
  - org.bytedeco:ffmpeg:8.1.2-1.5.14:windows-x86_64
  - org.bytedeco:ffmpeg:8.1.2-1.5.14:macosx-arm64
  - org.bytedeco:ffmpeg:8.1.2-1.5.14:macosx-x86_64

settings:
  compose:
    enabled: true
    resources:
      packageName: com.mrboomdev.scrollix.resources
      # Generate public accessors so other modules (and previews) can use Res.*
      exposedAccessors: true
  kotlin: 
    serialization: enabled
    # Room generates its database implementations per platform through KSP.
    ksp:
      processors:
        - $libs.androidx.room3.compiler